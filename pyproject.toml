[project]
name = "tristatelite"
version = "0.1.0"
description = "Lightweight probabilistic joint SOC, SOH, and TTE prediction"
requires-python = ">=3.11,<3.13"
dependencies = [
  "torch>=2.2,<3.0",
  "numpy>=1.26,<3.0",
  "pandas>=2.2,<3.0",
  "scipy>=1.12,<2.0",
  "pyarrow>=15,<25",
  "pyyaml>=6,<7",
]

[project.optional-dependencies]
dev = [
  "ipykernel>=7,<8",
  "nbclient>=0.11,<1",
  "nbformat>=5.10,<6",
  "pytest>=8,<10",
  "ruff>=0.5,<1.0",
]

[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
